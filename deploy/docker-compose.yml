services:
  immich-tv-auth:
    image: ghcr.io/xechehot/immich-android-tv-authentication:latest
    container_name: immich-tv-auth
    restart: unless-stopped
    environment:
      - API_KEY=${AUTH_SHARED_SECRET}   # must match the app's api_key string resource
      - IMMICH_INTERNAL_URL=http://immich_server:2283
    ports:
      - "5055:5000"   # host:container — change host port if 5055 is taken
    networks:
      - immich_default

networks:
  immich_default:
    external: true
